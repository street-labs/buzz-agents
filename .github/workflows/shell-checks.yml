name: shell checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  embedded-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: bash -n agent-watcher.sh
      - name: embedded python payloads compile
        run: ./check-embedded-python.sh
      - name: salon offline tests
        run: ./test-salon.sh
